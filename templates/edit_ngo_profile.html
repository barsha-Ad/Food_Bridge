<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit NGO Profile | FoodBridge</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">

<div class="min-h-screen">

    <!-- Header -->
    <div class="bg-white border-b">
        <div class="max-w-5xl mx-auto px-6 py-5">

            <div class="flex items-center justify-between">

                <div>
                    <h1 class="text-2xl font-bold text-gray-800">
                        Edit NGO Profile
                    </h1>

                    <p class="text-sm text-gray-500 mt-1">
                        Update your NGO information
                    </p>
                </div>

                <a href="{% url 'ngo_profile' %}"
                   class="px-4 py-2.5 bg-gray-100 text-gray-700
                          rounded-lg hover:bg-gray-200 transition">
                    ← Back to Profile
                </a>

            </div>

        </div>
    </div>


    <!-- Main -->
    <div class="max-w-5xl mx-auto px-6 py-8">

        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">

            <!-- Profile Header -->
            <div class="bg-gradient-to-r from-green-700 to-green-600
                        px-8 py-7">

                <div class="flex items-center gap-5">

                    <!-- Current Image -->
                    <div class="w-24 h-24 rounded-2xl bg-white p-1 shadow">

                        {% if ngo.image %}
                            <img src="{{ ngo.image.url }}"
                                 class="w-full h-full object-cover rounded-xl">
                        {% else %}
                            <div class="w-full h-full rounded-xl
                                        bg-green-100 flex items-center
                                        justify-center text-4xl">
                                🏢
                            </div>
                        {% endif %}

                    </div>

                    <div class="text-white">

                        <h2 class="text-xl font-semibold">
                            {{ ngo.name }}
                        </h2>

                        <p class="text-green-100 text-sm mt-1">
                            NGO Profile
                        </p>

                        <span class="inline-block mt-3 px-3 py-1
                                     bg-white/20 rounded-full text-xs">
                            ● {{ ngo.status }}
                        </span>

                    </div>

                </div>

            </div>


            <!-- Form -->
            <form method="POST"
                  enctype="multipart/form-data"
                  class="p-8">

                {% csrf_token %}

                <h3 class="text-lg font-semibold text-gray-800 mb-6">
                    Basic Information
                </h3>


                <!-- NGO Name -->
                <div class="mb-5">

                    <label class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        NGO Name
                    </label>

                    <input type="text"
                           name="name"
                           value="{{ ngo.name }}"
                           required
                           class="w-full px-4 py-3 border border-gray-300
                                  rounded-xl focus:ring-2
                                  focus:ring-green-500 focus:border-green-500
                                  outline-none transition">
                </div>


                <!-- Email + Phone -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">

                    <div>

                        <label class="block text-sm font-medium
                                      text-gray-700 mb-2">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               value="{{ ngo.email }}"
                               required
                               class="w-full px-4 py-3 border border-gray-300
                                      rounded-xl focus:ring-2
                                      focus:ring-green-500 outline-none">
                    </div>


                    <div>

                        <label class="block text-sm font-medium
                                      text-gray-700 mb-2">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               value="{{ ngo.phone }}"
                               required
                               class="w-full px-4 py-3 border border-gray-300
                                      rounded-xl focus:ring-2
                                      focus:ring-green-500 outline-none">
                    </div>

                </div>


                <!-- City -->
                <div class="mb-5">

                    <label class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        City
                    </label>

                    <input type="text"
                           name="city"
                           value="{{ ngo.city }}"
                           required
                           class="w-full px-4 py-3 border border-gray-300
                                  rounded-xl focus:ring-2
                                  focus:ring-green-500 outline-none">
                </div>


                <!-- Address -->
                <div class="mb-5">

                    <label class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        Address
                    </label>

                    <textarea name="address"
                              rows="3"
                              required
                              class="w-full px-4 py-3 border border-gray-300
                                     rounded-xl focus:ring-2
                                     focus:ring-green-500 outline-none resize-none">{{ ngo.address }}</textarea>
                </div>


                <!-- Description -->
                <div class="mb-6">

                    <label class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        About NGO
                    </label>

                    <textarea name="description"
                              rows="4"
                              placeholder="Tell people about your NGO..."
                              class="w-full px-4 py-3 border border-gray-300
                                     rounded-xl focus:ring-2
                                     focus:ring-green-500 outline-none
                                     resize-none">{{ ngo.description }}</textarea>
                </div>


                <!-- Image -->
                <div class="mb-8">

                    <label class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        NGO Image
                    </label>

                    <div class="border-2 border-dashed
                                border-gray-300 rounded-xl p-6
                                hover:border-green-500 transition">

                        <input type="file"
                               name="image"
                               accept="image/*"
                               class="w-full text-sm text-gray-600">

                        <p class="text-xs text-gray-400 mt-2">
                            Upload a clear image of your NGO
                        </p>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="flex items-center justify-end gap-3
                            border-t pt-6">

                    <a href="{% url 'ngo_profile' %}"
                       class="px-6 py-3 bg-gray-100 text-gray-700
                              rounded-xl font-medium
                              hover:bg-gray-200 transition">
                        Cancel
                    </a>

                    <button type="submit"
                            class="px-7 py-3 bg-green-600 text-white
                                   rounded-xl font-semibold
                                   hover:bg-green-700 transition
                                   shadow-sm">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
