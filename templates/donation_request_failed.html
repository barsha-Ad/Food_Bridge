{% extends 'base.html' %}

{% block title %}Request Failed{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-sm border
                border-slate-200 p-8 max-w-md w-full text-center">

        <div class="text-6xl mb-5">
            ❌
        </div>

        <h1 class="text-2xl font-bold text-slate-800">
            Request Failed
        </h1>

        <p class="text-slate-500 mt-3">
            Sorry, your donation request could not be sent.
            Please try again.
        </p>

        <a href="{% url 'dashboard' %}"
           class="inline-block mt-6 px-6 py-3
                  bg-slate-900 text-white rounded-xl
                  font-medium hover:bg-emerald-600 transition">

            Back to Dashboard

        </a>

    </div>

</div>

{% endblock %}
