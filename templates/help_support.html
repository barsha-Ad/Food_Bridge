{% extends 'base.html' %}

{% block title %}Help & Support{% endblock %}

{% block content %}

<div class="ml-0 md:ml-72 min-h-screen bg-gray-100 p-8">

<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-8">

<h1 class="text-4xl font-bold text-emerald-600 mb-2">
❓ Help & Support
</h1>

<p class="text-gray-500 mb-8">
Facing any problem? Send us your query.
</p>

<form method="POST">

{% csrf_token %}

<div class="mb-5">
<label>Name</label>
{{ form.name }}
</div>

<div class="mb-5">
<label>Email</label>
{{ form.email }}
</div>

<div class="mb-5">
<label>Subject</label>
{{ form.subject }}
</div>

<div class="mb-5">
<label>Message</label>
{{ form.message }}
</div>

<button
type="submit"
class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl">

Send Message

</button>

</form>

</div>

</div>

{% endblock %}
