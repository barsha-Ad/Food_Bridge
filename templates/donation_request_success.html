{% extends 'base.html' %}

{% block title %}Request Sent{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-50
            flex items-center justify-center p-6">

    <div class="bg-white rounded-2xl
                shadow-sm border border-slate-200
                p-10 text-center
                max-w-lg w-full">

        <!-- Success Icon -->
        <div class="w-16 h-16 mx-auto
                    rounded-full bg-emerald-100
                    flex items-center justify-center
                    text-3xl">
            ✓
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-slate-800 mt-5">
            Donation Request Sent
        </h1>

        <p class="text-slate-500 mt-3">
            Your donation request has been sent successfully to
        </p>

        <!-- NGO Name -->
        <h2 class="text-xl font-semibold
                   text-emerald-700 mt-3">
            {{ ngo.name }}
        </h2>

        <!-- NGO Location -->
        <p class="text-sm text-slate-500 mt-2">
            📍 {{ ngo.city }}
        </p>

        <!-- Back Button -->
        <a href="{% url 'ngo' %}"
           class="inline-block mt-7
                  px-6 py-3
                  bg-slate-900
                  text-white
                  rounded-xl
                  font-semibold
                  hover:bg-emerald-600
                  transition">

            ← Back to NGOs

        </a>

    </div>

</div>

{% endblock %}
