<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reject Donation | Food Bridge</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center">


    <div class="bg-white w-full max-w-lg mx-4 rounded-2xl shadow-lg p-8">


        <!-- HEADER -->

        <div class="text-center mb-6">

            <div class="w-16 h-16 bg-red-100
                        rounded-full flex items-center
                        justify-center mx-auto mb-4">

                <span class="text-3xl">❌</span>

            </div>

            <h1 class="text-2xl font-bold text-gray-800">
                Reject Donation
            </h1>

            <p class="text-gray-500 mt-2">
                Please provide a reason for rejecting this donation.
            </p>

        </div>


        <!-- DONATION INFO -->

        <div class="bg-gray-50 rounded-xl p-4 mb-6">

            <p class="text-sm text-gray-500">
                Food
            </p>

            <p class="font-semibold text-gray-800">
                {{ donation.food_name }}
            </p>

            <p class="text-sm text-gray-500 mt-3">
                Donor
            </p>

            <p class="font-semibold text-gray-800">
                {{ donation.donor_name }}
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

        <div class="bg-red-50 border border-red-200
                    text-red-600 rounded-lg p-3 mb-4">

            {{ error }}

        </div>

        {% endif %}


        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}


            <label class="block text-sm font-medium
                          text-gray-700 mb-2">

                Rejection Reason

            </label>


            <textarea
                name="rejection_reason"
                rows="5"
                required
                placeholder="Example: Food quantity is insufficient..."
                class="w-full border border-gray-300
                       rounded-xl px-4 py-3
                       focus:outline-none
                       focus:ring-2 focus:ring-red-500
                       resize-none"></textarea>


            <!-- BUTTONS -->

            <div class="flex gap-3 mt-6">

                <a
                    href="{% url 'ngo_dashboard' %}"
                    class="flex-1 text-center
                           bg-gray-200 text-gray-700
                           py-3 rounded-xl
                           font-medium
                           hover:bg-gray-300 transition">

                    Cancel

                </a>


                <button
                    type="submit"
                    class="flex-1 bg-red-600
                           text-white py-3 rounded-xl
                           font-medium
                           hover:bg-red-700 transition">

                    Reject Donation

                </button>

            </div>

        </form>

    </div>

</body>

</html>
