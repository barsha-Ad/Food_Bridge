{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">

    <h2 class="text-2xl font-bold text-center mb-5">
        Verify OTP
    </h2>

    {% if error %}
        <p class="text-red-600 mb-3">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="otp"
            placeholder="Enter OTP"
            class="w-full border p-3 rounded-lg mb-4"
            required>

        <button
            type="submit"
            class="w-full bg-emerald-600 text-white p-3 rounded-lg">

            Verify OTP

        </button>

    </form>

</div>

{% endblock %}
