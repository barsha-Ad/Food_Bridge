{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow">

    <h2 class="text-2xl font-bold mb-4 text-center">
        Forgot Password
    </h2>

    <form method="POST">
        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            class="w-full border p-3 rounded-lg mb-4"
            required>

        <button
            class="w-full bg-emerald-600 text-white py-3 rounded-lg">

            Send OTP

        </button>

    </form>

</div>

{% endblock %}
